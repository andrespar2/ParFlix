name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: Escaneo de secretos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar patrones de credenciales
        shell: pwsh
        run: ./scripts/check-secrets.ps1

  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas unitarias
        run: ./gradlew :app:testDebugUnitTest --console=plain

  build:
    name: Compilación debug
    runs-on: ubuntu-latest
    needs: [secret-scan, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensamblar APK debug
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: parflix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
