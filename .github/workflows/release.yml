name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Si la release ya fue creada desde el equipo de desarrollo con el APK
  # firmado, el workflow no la toca ni sube artefactos alternativos.
  guard:
    name: Comprobar release existente
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Buscar release publicada
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "La release ${{ github.ref_name }} ya existe; no se modifica."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Construir y publicar APK
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Escanear secretos
        shell: pwsh
        run: ./scripts/check-secrets.ps1

      # La compilación de release usa credenciales de codificación en tiempo de
      # compilación definidas en Gradle para builds sin secrets.properties
      # (quedan ofuscadas por R8). No se usan secretos reales en CI.
      - name: Ensamblar APK release
        run: ./gradlew :app:assembleRelease --console=plain

      # Nunca publicar un APK sin firma ni firmado con la clave de depuración.
      - name: Verificar firma de distribución
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/*.apk "ParFlix-${{ github.ref_name }}.apk"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "ParFlix-${{ github.ref_name }}.apk" \
            --title "ParFlix ${{ github.ref_name }}" \
            --generate-notes
